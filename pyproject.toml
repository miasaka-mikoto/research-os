[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os"
version = "0.2.0"
description = "Research OS — a local, durable graph workspace for personal research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Research OS contributors"}]
dependencies = []

[project.scripts]
researchos = "researchos.app:main"
researchos-agent = "researchos.agent_cli:main"

[tool.setuptools]
packages = ["researchos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
